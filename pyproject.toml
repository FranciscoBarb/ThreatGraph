   [build-system]
   requires = ["setuptools>=68"]
   build-backend = "setuptools.build_meta"

   [project]
   name = "threatgraph"
   version = "0.1.0"
   description = "Turns free-text cybersecurity reports into a Neo4j knowledge graph."
   requires-python = ">=3.11"
   dependencies = []

   [project.optional-dependencies]
   dev = ["pytest>=8"]

   [tool.setuptools.packages.find]
   where = ["src"]

   [tool.pytest.ini_options]
   testpaths = ["tests"]