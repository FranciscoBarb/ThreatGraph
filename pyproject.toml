[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatgraph"
version = "0.1.0"
description = "Turns free-text cybersecurity reports into a Neo4j knowledge graph."
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Neo4j (docker compose up -d)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]